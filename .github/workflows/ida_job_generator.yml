name: IDA Job Generator (A1)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ida-gateway-main-writer
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A1 Guardrails
        id: guardrails
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent_outbox ops/logs ops/flags

          if [ -f "ops/flags/STOP_AUTOPILOT" ]; then
            echo "STOP_AUTOPILOT present - skipping generation"
            echo "generate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pending=$(find agent_outbox -maxdepth 1 -type f -name "*.json" | wc -l | tr -d " ")
          echo "Pending jobs: $pending"

          if [ "$pending" -ge 3 ]; then
            echo "Backlog cap reached - skipping generation"
            echo "generate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "generate=true" >> "$GITHUB_OUTPUT"

      - name: Generate job and ops log
        if: steps.guardrails.outputs.generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          job_timestamp=$(date -u +"%Y%m%d-%H%M%S")
          log_timestamp=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          job_path="agent_outbox/job-autogen-${job_timestamp}.json"

          cat > "$job_path" <<'JSON'
          {
            "task": "ROI_SCAN",
            "rules": [
              "No selling IDA",
              "No 'published/committed' claims without SHA+link",
              "Output must be concrete repo actions (files/paths), not ideas"
            ],
            "deliverables": [
              "agent_results/ROI_PLAN.md",
              "ops/logs/AUTORUN_LOG.md"
            ],
            "focus": [
              "global markets + arbitrage opportunities",
              "news/finance intelligence engine (not just social media)",
              "3 parallel revenue engines, lowest effort first"
            ]
          }
          JSON

          echo "[${log_timestamp}] A1 generated ${job_path}" >> ops/logs/AUTORUN_LOG.md
          echo "Created ${job_path}"

      - name: Commit generated work safely
        if: steps.guardrails.outputs.generate == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ida-outbox-bot"
          git config user.email "ida-outbox-bot@users.noreply.github.com"
          git add agent_outbox ops/logs/AUTORUN_LOG.md

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "IDA A1: generate job"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push attempt ${attempt}/3 failed"
            sleep 2
          done

          echo "Push failed after 3 attempts"
          exit 1
